name: Signed feature APK

on:
  push:
    branches: [feature/compatible-web-search]

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing and Meta secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.VISOR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VISOR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VISOR_KEY_ALIAS }}
          META_HW_TOKEN: ${{ secrets.VISOR_META_HW_TOKEN }}
          META_AR_TOKEN: ${{ secrets.VISOR_META_AR_TOKEN }}
          META_FRL_TOKEN: ${{ secrets.VISOR_META_FRL_TOKEN }}
        run: |
          for secret in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS META_HW_TOKEN META_AR_TOKEN META_FRL_TOKEN; do
            if [ -z "${!secret}" ]; then
              echo "::error::Required signing or Meta secret $secret is missing"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/visor-release.p12"

      - name: Build signed APK
        env:
          VISOR_KEYSTORE: ${{ runner.temp }}/visor-release.p12
          VISOR_KEYSTORE_PASSWORD: ${{ secrets.VISOR_KEYSTORE_PASSWORD }}
          VISOR_KEY_ALIAS: ${{ secrets.VISOR_KEY_ALIAS }}
          VISOR_VERSION_NAME: 3.0.2-search
          VISOR_VERSION_CODE: '30002'
          VISOR_META_HW_TOKEN: ${{ secrets.VISOR_META_HW_TOKEN }}
          VISOR_META_AR_TOKEN: ${{ secrets.VISOR_META_AR_TOKEN }}
          VISOR_META_FRL_TOKEN: ${{ secrets.VISOR_META_FRL_TOKEN }}
        run: ./gradlew :app:assembleRelease

      - name: Verify signature and package
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk" | grep 'certificate SHA-256'
          mkdir -p dist
          cp "$apk" dist/visor-3.0.2-search.apk
          (cd dist && sha256sum visor-3.0.2-search.apk > visor-3.0.2-search.apk.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: visor-3.0.2-search-signed
          path: dist/*
          retention-days: 14

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/visor-release.p12"
